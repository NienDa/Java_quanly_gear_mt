<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Đặt Hàng Thành Công - Gear Shop</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: #ffffff;
            width: 500px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .success-icon {
            font-size: 4rem;
            color: #198754;
            margin-bottom: 1.5rem;
        }

        .order-info {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: left;
            margin: 1.5rem 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
            border-top: 1px dashed #dee2e6;
            padding-top: 0.5rem;
        }
    </style>
</head>

<body>

    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-patch-check-fill"></i>
        </div>

        <h2 class="fw-bold text-dark mb-2">Đặt Hàng Thành Công!</h2>
        <p class="text-muted">Cảm ơn bạn đã tin tưởng mua sắm tại Gear Shop. Đơn hàng của bạn đang được xử lý.</p>

        <div class="order-info">
            <div class="info-row">
                <span class="text-muted">Mã đơn hàng:</span>
                <strong class="text-dark" th:text="'#' + ${order.id}"></strong>
            </div>
            <div class="info-row">
                <span class="text-muted">Ngày đặt:</span>
                <span class="fw-semibold text-dark"
                    th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <div class="info-row">
                <span class="text-muted">Phương thức thanh toán:</span>
                <span class="fw-semibold text-dark"
                    th:text="${payment != null ? payment.paymentMethod : 'Chưa rõ'}"></span>
            </div>
            <div class="info-row">
                <span class="text-muted">Trạng thái thanh toán:</span>
                <span class="badge bg-success" th:if="${payment != null && payment.status == 'COMPLETED'}">Đã thanh
                    toán</span>
                <span class="badge bg-warning text-dark" th:if="${payment != null && payment.status == 'PENDING'}">Chưa
                    thanh toán</span>
            </div>
            <div class="info-row">
                <span class="text-dark fw-bold">Tổng thanh toán:</span>
                <strong class="text-danger fs-5"
                    th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
            </div>
        </div>

        <div class="d-grid gap-2 mt-4">
            <a href="/" class="btn btn-primary rounded-pill py-2 fw-semibold">
                <i class="bi bi-shop me-1"></i> Tiếp tục mua sắm
            </a>
            <a href="/my-orders" class="btn btn-outline-secondary rounded-pill py-2 fw-semibold">
                <i class="bi bi-clock-history me-1"></i> Xem lịch sử mua hàng
            </a>
        </div>
    </div>

</body>

</html>
