<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Inventory</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventory Management</h2>
            <a href="/home" class="btn btn-secondary">Back to Dashboard</a>
        </div>
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Import Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="i : ${inventories}">
                    <td th:text="${i.id}"></td>
                    <td th:text="${i.product.productName}">
                    </td>
                    <td th:text="${i.quantity}"></td>
                    <td th:text="${i.importDate}"></td>
                    <td>
                        <a th:href="@{/inventory/edit/{id}(id=${i.id})}" class="btn btn-warning btn-sm">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
