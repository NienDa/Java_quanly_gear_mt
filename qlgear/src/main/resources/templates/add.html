<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Product</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

</head>

<body>

    <div class="container mt-5">

        <div class="card p-4">

            <h2 class="mb-4">
                Add Product
            </h2>

            <form th:action="@{/add/save}" method="post" th:object="${product}" enctype="multipart/form-data">

                <div class="mb-3">

                    <label>Product Name</label>

                    <input type="text" class="form-control" th:field="*{productName}">

                </div>

                <div class="mb-3">

                    <label>Brand</label>

                    <input type="text" class="form-control" th:field="*{brand}">

                </div>

                <div class="mb-3">

                    <label>Description</label>

                    <textarea class="form-control" th:field="*{description}">
                </textarea>

                </div>

                <div class="mb-3">

                    <label>Price</label>

                    <input type="number" class="form-control" th:field="*{price}">

                </div>
                <div class="mb-3">

                    <label>
                        Category
                    </label>

                    <select class="form-select" th:field="*{category}">
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}">

                        </option>

                    </select>

                </div>

                <div class="mb-3">
                    <label>Product Image</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">

                    <label>Status</label>

                    <select class="form-select" th:field="*{status}">
                        <option value="AVAILABLE">Còn hàng</option>
                        <option value="OUT_OF_STOCK">Hết hàng</option>
                    </select>

                </div>

                <button type="submit" class="btn btn-success ms-1">
                    Thêm sản phẩm
                </button>

            </form>

        </div>

    </div>

</body>

</html>
